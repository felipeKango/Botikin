project_id = "botikin"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "botikin://auth-callback"
additional_redirect_urls = ["botikin://auth-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true

[functions.ai-engine]
verify_jwt = true

[functions.auth-api]
verify_jwt = false

[functions.payments-api]
# El webhook de retorno de WebPay llega sin JWT
verify_jwt = false

[functions.notif-api]
verify_jwt = true

[functions.discount-code-api]
verify_jwt = true

[functions.admin-dashboard-api]
verify_jwt = true

[functions.expiry-scheduler]
# Invocada por pg_cron con el service_role key
verify_jwt = false
