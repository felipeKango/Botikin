name: Botikin
options:
  bundleIdPrefix: app.botikin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BotikinKit:
    path: BotikinKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Botikin:
    type: application
    platform: iOS
    sources:
      - path: Botikin
    dependencies:
      - package: BotikinKit
    info:
      path: Botikin/Resources/Info.plist
      properties:
        CFBundleDisplayName: Botikin
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: >-
          Botikin usa la cámara para fotografiar tus recetas médicas y
          analizarlas con IA.
        NSPhotoLibraryUsageDescription: >-
          Botikin accede a tu galería para elegir la foto de una receta
          médica y analizarla con IA.
        CFBundleURLTypes:
          - CFBundleURLName: app.botikin.ios
            CFBundleURLSchemes:
              - botikin
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.botikin.ios
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Botikin:
    build:
      targets:
        Botikin: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: BotikinKit/BotikinKitTests
